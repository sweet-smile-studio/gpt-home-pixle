<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f0ec" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Maedeh ✨️ Football Planner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css?v=20260901-homeexact1" />
</head>
<body data-home-design="home-reference-v1">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-card">
        <img src="icons/icon-192.png" alt="Sweet Smile Studio" class="brand-icon" />
        <div>
          <h1>Maedeh ✨️</h1>
          <p>Sweet Smile Studio Planner</p>
        </div>
      </div>
      <nav class="nav" aria-label="Planner navigation">
        <div class="nav-group"><span class="nav-group-title">MAIN</span>
          <button data-view="home" class="nav-item"><span class="nav-glyph">⌂</span> Home</button>
          <button data-view="today" class="nav-item"><span class="nav-glyph">◈</span> امروز</button>
          <button data-view="week" class="nav-item"><span class="nav-glyph">▤</span> هفته</button>
          <button data-view="month" class="nav-item"><span class="nav-glyph">▦</span> ماه</button>
        </div>
        <div class="nav-group"><span class="nav-group-title">MIND & PLANNING</span>
          <button data-view="ideas" class="nav-item"><span class="nav-glyph">✧</span> ایده‌ها</button>
          <button data-view="brain" class="nav-item"><span class="nav-glyph">◇</span> بارش فکری</button>
          <button data-view="habits" class="nav-item"><span class="nav-glyph">☷</span> عادت‌ها</button>
          <button data-view="tools" class="nav-item"><span class="nav-glyph">⌁</span> ابزارها</button>
          <button data-view="pomodoro" class="nav-item"><span class="nav-glyph">◷</span> پومودورو</button>
        </div>
        <div class="nav-group"><span class="nav-group-title">FOOTBALL</span>
          <button data-view="training" class="nav-item"><span class="nav-glyph">▦</span> تمرینات و مسابقات</button>
          <button data-view="goals" class="nav-item"><span class="nav-glyph">⚽</span> اهداف و مأموریت‌ها</button>
          <button data-view="performance" class="nav-item"><span class="nav-glyph">⌁</span> عملکرد و آمار</button>
          <button data-view="tactics" class="nav-item"><span class="nav-glyph">▤</span> یادداشت‌ها و تاکتیک‌ها</button>
          <button data-view="achievements" class="nav-item"><span class="nav-glyph">🏆</span> افتخارات</button>
        </div>
        <div class="nav-group"><span class="nav-group-title">BODY</span>
          <button data-view="health" class="nav-item"><span class="nav-glyph">💧</span> رژیم غذایی و سلامت</button>
        </div>
        <div class="nav-group"><span class="nav-group-title">ACCOUNT</span>
          <button data-view="profile" class="nav-item"><span class="nav-glyph">⚙</span> پروفایل و تنظیمات</button>
        </div>
      </nav>
      <div class="install-box">
        <button id="installBtn" class="premium-btn muted" hidden>نصب مثل اپ</button>
        <button id="notifyBtn" class="premium-btn">فعال‌سازی نوتیفیکیشن</button>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <main class="main">
      <header class="topbar" id="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="open menu">☰</button>
        <div class="date-title">
          <span class="today-line"><span id="viewLabel">امروز</span><b id="currentTimeLabel" class="live-clock">--:--</b></span>
          <strong id="currentDateLabel"></strong>
          <small><span id="gregorianDateLabel"></span></small>
        </div>
        <div class="date-controls">
          <button id="prevDay" class="icon-btn">‹</button>
          <input id="datePicker" type="date" />
          <button id="nextDay" class="icon-btn">›</button>
        </div>
      </header>

      <section id="home" class="view active"></section>
      <section id="today" class="view"></section>
      <section id="week" class="view"></section>
      <section id="month" class="view"></section>
      <section id="brain" class="view"></section>
      <section id="ideas" class="view"></section>
      <section id="habits" class="view"></section>
      <section id="tools" class="view"></section>
      <section id="pomodoro" class="view"></section>
      <section id="training" class="view"></section>
      <section id="goals" class="view"></section>
      <section id="performance" class="view"></section>
      <section id="health" class="view"></section>
      <section id="tactics" class="view"></section>
      <section id="achievements" class="view"></section>
      <section id="profile" class="view"></section>
    </main>
  </div>

  <template id="cardTemplate">
    <article class="panel section-card">
      <div class="panel-head">
        <h2></h2>
        <div class="panel-actions"></div>
      </div>
      <div class="panel-body"></div>
    </article>
  </template>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="bottom-nav-item active" data-view="home"><img src="icons/home/nav-home.jpg" alt=""><small>Home</small></button>
    <button class="bottom-nav-item" data-view="today"><img src="icons/home/nav-today.jpg" alt=""><small>Today</small></button>
    <button class="bottom-nav-item" data-view="brain"><img src="icons/home/nav-brain.jpg" alt=""><small>Brain Dump</small></button>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
  <script src="js/firebase-config.js?v=20260901-homeexact1"></script>
  <script src="js/app.js?v=20260901-homeexact1"></script>
</body>
</html>
